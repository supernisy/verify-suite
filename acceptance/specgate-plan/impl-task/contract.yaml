contract: verify-suite
intent: |
  判定产线页面对 demo 原型的视觉还原度与交互还原度，输出可判定的差异报告。

  - 采集只认运行时计算值（getBoundingClientRect + getComputedStyle），不读源码声明值。
  - 比对的是坐标差值（inLeft = 内容左边缘 − 盒子左边缘），不是 DOM 属性（padding/margin）。
  - 主键按七级降级链：data-testid > role+accname > 表单 name > 接口字段路径 > 结构性文案 > 结构指纹 > 阅读顺序。
  - 容差按量纲分类：连续量 ±1px；离散设计 token（字号/字重/圆角/图标尺寸）零容差。
  - 差异输出必须标注方向：哪边是产线、哪边是 demo，谁偏大偏小。
  - 退出码：0 无差异 / 1 执行错误 / 2 检出差异。
  - 所有命令只操作受控标签页，绝不操作用户当前正在看的标签页。
  - 轨迹比对必须两侧各自对照同一份语义断言，不比较两侧的变化量是否相同。

accept:
  - id: A1
    given: 同一个元素，源码声明 width 480px 但被父容器 flex 压缩
    when: 执行 geo-collect 采集该元素的 boxW
    then: 返回值为最终渲染宽度（被压缩后的值），不等于 480
    verify: geo
    suspect: false
    invariants:
      - 父容器可用宽度缩小后，采集到的 boxW 不增加

  - id: A2
    given: 两个元素视觉内边距相同，但一个用 padding、一个用 margin+占位元素实现
    when: 执行采集并计算 inLeft（内容左边缘 − 盒子左边缘）
    then: 两者的 inLeft 差值 ≤ 1px，判定为无差异
    verify: geo
    suspect: false
    invariants:
      - 实现的内边距每增大一档，inLeft 单调增加，且增加的档位数与内边距档位数一致

  - id: A3
    given: 两侧组件库不同、class 名完全不同，但同为「新任务」按钮
    when: 执行 ax-collect 并用 ax-diff 比对
    then: 两者指纹同为 button|新任务，判定为精确对齐
    verify: ax
    suspect: false

  - id: A4
    given: 两个页面字号分别为 14px 与 13px
    when: 执行 geo-compare 且 fontSize 在 strict 列表内
    then: 判定为 FAIL（零容差），退出码为 2
    verify: unit
    suspect: false
    invariants:
      - 容差数值调整变大后，被判定为 FAIL 的字段数不增加

  - id: A5
    given: 产线 inLeft 为 8、demo inLeft 为 12
    when: 执行 ax-diff 并传入 --label-exp demo --label-act 产线
    then: 输出行同时包含「产线 8」「demo 12」与「产线偏小 -4」
    verify: unit
    suspect: false

  - id: A6
    given: 一次比对检出至少 1 项差异
    when: 比对命令执行结束
    then: 进程退出码为 2；无差异时为 0；执行错误（目标未找到）时为 1
    verify: unit
    suspect: false

  - id: A7
    given: 用户浏览器已打开若干正在浏览的标签页
    when: 执行任意采集命令
    then: 命令只作用于新建的受控标签页，活动标签页的 URL 全程不变
    verify: unit-visual
    suspect: false

  - id: A8
    given: demo 侧 mock 10 条数据、产线侧真实 20 条数据，两侧节点变化量必然不同
    when: 执行 trace-run（两侧）后执行 trace-diff
    then: 对每条 expect 断言分别判定两侧是否达成，输出「两侧都达成 / 仅一侧不达成 / 两侧都不达成」三分类，且不因数据量差异产生「变化量不同」类报告
    verify: trace
    suspect: false
    invariants:
      - 把任一侧的数据量翻倍时，断言达成情况必须保持不变

  - id: A9
    given: 一次比对报告全绿（0 项差异）
    when: 人工注入一条已知故障（故意比对一个仅基准侧存在的元素）
    then: 检测器必须报出差异且退出码为 2
    verify: unit
    suspect: false

out_of_scope:
  - 单元测试业务逻辑（非本工具职责）
  - 性能与内存分析
  - 可访问性合规审计
  - WebGL / Canvas 内容比对
  - 暗色模式与高对比度模式自动对照

uses:
  components: []
  api: []
  tokens: []

breaks: []

