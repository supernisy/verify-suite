<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>数字员工控制台 · 产线实现</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "Microsoft YaHei", sans-serif;
    background: #f7f8fa; padding: 24px;
  }
  .panel {
    width: 320px; background: #fff;
    border-radius: 8px; padding: 16px;
    box-shadow: 0 1px 3px rgba(0,0,0,.08);
  }
  /* 差异1：设计稿 20px / 600，产线写成 18px —— 离散 token，零容差必抓 */
  h1 { font-size: 18px; font-weight: 600; color: #1f2329; margin-bottom: 16px; }
  .btn {
    display: block; width: 100%; height: 36px;
    /* 差异2：设计稿 padding-left 12px，产线写成 8px —— 连续量，±1px 容差 */
    padding-left: 8px; text-align: left;
    font-size: 14px; font-weight: 500;
    border: none; border-radius: 6px;
    background: #3b82f6; color: #fff;
    margin-bottom: 8px; cursor: pointer;
  }
  .btn.ghost { background: transparent; color: #1f2329; }
</style>
</head>
<body>
  <div class="panel">
    <h1>数字员工</h1>
    <button class="btn" data-testid="btn-new">新任务</button>
    <!-- 差异3：文案漂移「技能」→「技能市场」—— 模糊对齐档 -->
    <button class="btn ghost" data-testid="btn-skill">技能市场</button>
    <!-- 差异4：产线多出来的按钮 —— 仅实测侧存在 -->
    <button class="btn ghost" data-testid="btn-del">删除</button>
  </div>
  <script>
    // ⚠️ 故障注入：产线漏实现了「新任务」的点击反馈
    // （设计稿有状态条，产线点了没反应 —— trace-diff 应判为 ✗ 改代码）
  </script>
</body>
</html>
