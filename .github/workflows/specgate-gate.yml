name: specgate 验收契约门禁

# 把「specgate 管该验什么，verify-suite 管怎么验」落成自动门禁：
# 任何改动 acceptance/ 下验收契约的 PR，都会先过 specgate lint，
# 契约不合格 → 本检查失败 → PR 不允许合并。
on:
  pull_request:
    paths:
      - 'acceptance/**'
      - '.github/workflows/specgate-gate.yml'
  push:
    branches: [main]
    paths:
      - 'acceptance/**'

permissions:
  contents: read

jobs:
  specgate-lint:
    name: specgate lint 验收契约
    runs-on: ubuntu-latest
    steps:
      - name: Checkout verify-suite
        uses: actions/checkout@v4
        with:
          path: repo

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Clone specgate（契约门禁工具）
        run: git clone --depth 1 https://github.com/supernisy/specgate.git "$RUNNER_TEMP/specgate"

      - name: Install specgate deps
        run: npm install --omit=dev --prefix "$RUNNER_TEMP/specgate"

      - name: Run specgate lint gate
        shell: bash
        run: |
          set -euo pipefail
          FAIL=0
          shopt -s nullglob
          for f in repo/acceptance/*.yaml; do
            base=$(basename "$f")
            # 跳过：故意写坏的演示样本（-bad）、未定稿草稿（.draft）
            case "$base" in
              *-bad.yaml|*.draft.yaml)
                echo "⏭️  跳过（非门禁目标）: $base"
                continue ;;
            esac
            echo "== specgate lint: $base =="
            node "$RUNNER_TEMP/specgate/src/cli.js" lint "$f" || FAIL=1
          done
          if [ "$FAIL" -ne 0 ]; then
            echo "❌ 存在未通过 specgate 门禁的验收契约，请先修正再合并。"
            exit 1
          fi
          echo "✅ 所有验收契约通过 specgate 门禁。"
